<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Agora - Previsão do Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-sky-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path></svg>
            Clima Agora
        </h1>
        <a href="https://github.com/ujullyaa/Tempo-clima.git" target="_blank" class="hover:text-sky-200 transition-colors font-medium">
            Ver no GitHub
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Como está o tempo?</h2>
            
            <div class="flex gap-2 mb-6">
                <input type="text" id="city-input" placeholder="Digite o nome da cidade..." class="flex-grow border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none" onkeypress="if(event.key === 'Enter') buscarClima()">
                <button onclick="buscarClima()" class="bg-sky-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-sky-700 transition-colors">
                    Buscar
                </button>
            </div>

            <p id="message" class="text-center text-gray-500 hidden"></p>

            <div id="weather-result" class="hidden flex-col items-center mt-4">
                <h3 id="city-name" class="text-xl font-semibold text-gray-700">São Paulo, BR</h3>
                <div class="flex items-center gap-4 my-4">
                    <img id="weather-icon" src="" alt="Ícone do clima" class="w-20 h-20">
                    <span id="temperature" class="text-5xl font-bold text-gray-800">25°C</span>
                </div>
                <p id="description" class="text-lg text-gray-600 capitalize mb-6">Céu limpo</p>
                
                <div class="w-full grid grid-cols-2 gap-4 border-t pt-4">
                    <div class="text-center">
                        <p class="text-sm text-gray-500">Umidade</p>
                        <p id="humidity" class="text-lg font-semibold text-gray-700">60%</p>
                    </div>
                    <div class="text-center">
                        <p class="text-sm text-gray-500">Vento</p>
                        <p id="wind" class="text-lg font-semibold text-gray-700">5 km/h</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-sm">
        <p>Desenvolvido por <span class="text-white font-semibold">Jullya Conceição</span> &copy; 2026</p>
    </footer>

    <script>
        const API_KEY = '22770bc7fcb05b7cefdc8a2aa879c3b2';

        async function buscarClima() {
            const cityInput = document.getElementById('city-input').value.trim();
            const messageEl = document.getElementById('message');
            const resultEl = document.getElementById('weather-result');

            if (!cityInput) {
                mostrarMensagem('Por favor, digite o nome de uma cidade.');
                return;
            }

            mostrarMensagem('Buscando...');
            resultEl.classList.add('hidden');

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${cityInput}&appid=${API_KEY}&units=metric&lang=pt_br`);
                
                if (!response.ok) {
                    throw new Error('Cidade não encontrada');
                }

                const data = await response.json();
                exibirClima(data);
                
            } catch (error) {
                mostrarMensagem('Cidade não encontrada. Tente novamente.');
            }
        }

        function exibirClima(data) {
            document.getElementById('message').classList.add('hidden');
            
            document.getElementById('city-name').textContent = `${data.name}, ${data.sys.country}`;
            document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
            document.getElementById('description').textContent = data.weather[0].description;
            document.getElementById('humidity').textContent = `${data.main.humidity}%`;
            document.getElementById('wind').textContent = `${(data.wind.speed * 3.6).toFixed(1)} km/h`; // Convertendo m/s para km/h
            
            const iconCode = data.weather[0].icon;
            document.getElementById('weather-icon').src = `https://openweathermap.org/img/wn/${iconCode}@4x.png`;
            
            document.getElementById('weather-result').classList.remove('hidden');
            document.getElementById('weather-result').classList.add('flex');
        }

        function mostrarMensagem(texto) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = texto;
            messageEl.classList.remove('hidden');
            document.getElementById('weather-result').classList.add('hidden');
        }
    </script>
</body>
</html>
